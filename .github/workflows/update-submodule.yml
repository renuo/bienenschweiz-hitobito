name: "Update hitobito submodule"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  update:
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.SUBMODULE_UPDATE_TOKEN }}
      # A real database is needed to regenerate db/schema.rb from the migrations.
      RAILS_DB_ADAPTER: postgresql
      RAILS_DB_HOST: 127.0.0.1
      RAILS_DB_PORT: 5432
      RAILS_DB_USERNAME: hitobito
      RAILS_DB_PASSWORD: hitobito
      RAILS_DB_NAME: hitobito_test
      RAILS_TEST_DB_NAME: hitobito_test
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hitobito
          POSTGRES_PASSWORD: hitobito
          POSTGRES_DB: hitobito_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hitobito"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          submodules: true

      - name: "Update hitobito submodule"
        id: submodule
        run: |
          git submodule update --remote hitobito
          if git diff --quiet; then
            echo "No upstream changes."
          else
            echo "sha=$(git -C hitobito rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: "Install OS deps"
        if: steps.submodule.outputs.sha
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libvips42

      - uses: ruby/setup-ruby@v1
        if: steps.submodule.outputs.sha

      - name: "Copy files for wagon and update lockfile"
        if: steps.submodule.outputs.sha
        run: |
          cp -v ../hitobito/.tool-versions ../hitobito/Gemfile.lock ./
          bundle lock
        working-directory: hitobito_bienenschweiz

      - uses: ruby/setup-ruby@v1
        if: steps.submodule.outputs.sha
        with:
          working-directory: hitobito_bienenschweiz
          bundler-cache: true

      - name: "Regenerate wagon db schema"
        if: steps.submodule.outputs.sha
        run: |
          bundle exec rake app:db:create app:db:schema:load db:migrate
          SCHEMA="$PWD/db/schema.rb" bundle exec rake app:db:schema:dump bienenschweiz:strip_search_columns
        working-directory: hitobito_bienenschweiz

      - name: "Regenerate Graphiti schema"
        if: steps.submodule.outputs.sha
        run: bundle exec rake app:graphiti:schema:generate
        working-directory: hitobito_bienenschweiz

      - name: "Create PR"
        if: steps.submodule.outputs.sha
        env:
          NEW_SHA: ${{ steps.submodule.outputs.sha }}
        run: |
          BRANCH=chore/update-hitobito-submodule

          git config user.name "Hitobito Core Update Bot"
          git config user.email "<>"

          git checkout -B "$BRANCH"
          git add hitobito hitobito_bienenschweiz/db/schema.rb hitobito_bienenschweiz/spec/support/graphiti/schema.json
          git commit -m "Update hitobito submodule to $NEW_SHA"
          git push --force-with-lease origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "Update hitobito submodule to $NEW_SHA" \
            --body "Automated daily update of the \`hitobito/\` submodule to upstream \`master\` (\`$NEW_SHA\`), including the regenerated wagon database schema and Graphiti schema." \
            || gh pr edit "$BRANCH" --title "Update hitobito submodule to $NEW_SHA"
