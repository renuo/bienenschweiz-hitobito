# Template for a non-course event (Anlass).
#
# Unlike courses, plain events have no Event::Kind, so each template is keyed by
# its file name. Every *.yml file in this directory shows up as one entry in the
# "Anlass nach Vorlage erstellen" dropdown on the Anlässe tab.
# Files starting with an underscore (like this one) are documentation and are
# never offered in the dropdown.
#
# Generate from an existing event:
#   cd hitobito && bundle exec rake bienenschweiz:event_template:dump[EVENT_ID,slug]
# Or print the YAML instead of writing the file:
#   cd hitobito && bundle exec rake bienenschweiz:event_template:dump[EVENT_ID,slug,stdout]

# Label shown in the dropdown. Defaults to the humanized file name if omitted.
label: "Beispielanlass"

# Event fields:
description: "Beschreibung des Anlasses"
location: "BienenSchweiz, Musterstrasse 1, 3000 Bern"
motto: ""
cost: "20 CHF"
maximum_participants: 40
minimum_participants: 5
external_applications: false
applications_cancelable: true
display_booking_info: true
participations_visible: true
globally_visible: false
export_to_website: true
application_conditions: "Voraussetzungen für die Teilnahme..."

# Contact attribute visibility. Lists must contain valid contact attr names.
# required_contact_attrs and hidden_contact_attrs are mutually exclusive per attribute.
required_contact_attrs:
  - phone_numbers
hidden_contact_attrs: []
visible_contact_attributes:
  - name
  - address
  - phone_number
  - email

# Questions appended to the form after any group-level question templates.
# Supported question fields: question, type, required, multiple_choices, choices
application_questions:
  - question: "Nehmen Sie am Apéro teil?"
    type: "Event::Question::Default"
    required: false
    multiple_choices: false

admin_questions: []
