# Event::Guest builds its gender enum and setter from Person::GENDERS, so the
# additional gender "d" needs a translation in its own attribute scope as well.
# The setter translates every possible value on each assignment, which means a
# missing entry here breaks assigning m/w to a guest, not just d.
de:
  activerecord:
    attributes:
      event/guest:
        genders:
          d: divers
