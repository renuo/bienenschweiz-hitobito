# Salutations are looked up per gender (activerecord.models.salutation.*.value.<gender>).
# The core only ships m/w/other, so the additional gender "d" needs its own values.
de:
  activerecord:
    models:
      salutation:
        default:
          value:
            d: Hallo %{greeting_name}
        available:
          lieber_vorname:
            value:
              d: Liebe*r %{first_name}
