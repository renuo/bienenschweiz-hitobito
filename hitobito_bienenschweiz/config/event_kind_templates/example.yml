# Template for Event::Kind with this ID.
# File name must match the Event::Kind ID (e.g. 42.yml for kind with id=42).
#
# Generate from an existing course:
#   cd hitobito && bundle exec rake bienenschweiz:event_kind_template:dump[COURSE_ID]
#
# Course fields:
description: "Beschreibung des Kurses"
location: "BienenSchweiz, Musterstrasse 1, 3000 Bern"
cost: "150 CHF"
maximum_participants: 20
minimum_participants: 5
requires_approval: false
external_applications: false
applications_cancelable: true
display_booking_info: true
participations_visible: true
export_to_website: true
delivery_address: "Lieferadresse..."
billing_address: "Rechnungsadresse..."
application_conditions: "Voraussetzungen für die Teilnahme..."

# Contact attribute visibility. Lists must contain valid contact attr names.
# required_contact_attrs and hidden_contact_attrs are mutually exclusive per attribute.
required_contact_attrs:
  - phone_numbers
hidden_contact_attrs: []
visible_contact_attributes:
  - name
  - address
  - phone_number
  - email

# Questions appended to the form after any group-level question templates.
# Supported question fields: question, type, required, multiple_choices, choices
application_questions:
  - question: "Haben Sie Erfahrung mit Bienenhaltung?"
    type: "Event::Question::Default"
    required: true
    multiple_choices: false

admin_questions:
  - question: "Teilnahme bestätigt?"
    type: "Event::Question::Default"
    required: true
