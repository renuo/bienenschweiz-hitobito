# Settings relevant for the hitobito_bienenschweiz wagon
# Overrides settings from the main application
application:
  logo:
    image: bienenschweiz_logo.png # put under app/assets/images
    height: 29 # pixel, has to bet set as the logo is a background image,
    width: 250 # pixel, will also set the minimal width of the navigation
    background_color: none # optional backgroundcolor, creates a box around the logo, if changed from 'none'
  languages:
    de: Deutsch

  # non UI languages for assigning to person#language
  additional_languages:
    en: Englisch
    fr: French
    it: Italian

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-bienenschweiz@renuo.ch

email:
  mailing_list_plus_addressing: <%= ENV['BIENENSCHWEIZ_MAILING_LIST_PLUS_ADDRESSING'] == 'true' %>

phone_number:
  custom_label:
    enabled: false

social_account:
  custom_label:
    enabled: false

additional_email:
  custom_label:
    enabled: false

additional_address:
  enabled: false
  custom_label:
    enabled: false

personal_documents:
  enabled: true

kas:
  base_url: <%= ENV['KAS_BASE_URL'] %>
  api_token: <%= ENV['KAS_API_TOKEN'] %>

messages:
  enable_writing: true

impersonate:
  notify: false

groups:
  statistics:
    enabled: false

# Abacus API to create invoices (see app/domain/invoices/abacus)
abacus:
  host: <%= ENV['ABACUS_HOST'] %>
  mandant: <%= ENV['ABACUS_MANDANT'] %>
  username: <%= ENV['ABACUS_USERNAME'] %>
  password: <%= ENV['ABACUS_PASSWORD'] %>
  # Maximum number of HTTP requests sent to Abacus per minute (blank or 0 = unlimited).
  # The firewall in front of Abacus rejects requests when too many are sent at once.
  max_requests_per_minute: <%= ENV['ABACUS_MAX_REQUESTS_PER_MINUTE'] %>
  # QR procedure (VESR internal no.) of the sales orders. Blank uses the default of the
  # Abacus mandant, 0 creates invoices without QR bill.
  payment_slip_internal_number: <%= ENV['ABACUS_PAYMENT_SLIP_INTERNAL_NUMBER'] %>

magazine_subscription_invoicing:
  # Creates the yearly invoices of magazine subscriptions in Abacus if true.
  enabled: <%= ENV['MAGAZINE_SUBSCRIPTION_INVOICING_ENABLED'] == 'true' %>
  # Number of months before the next subscription period starts to create the invoice.
  lead_time_months: 2
  # Abacus articles used for the invoices. The prices are taken from the article in Abacus.
  articles:
    abo_biez:
      article_number: abo-biez
    abo_biez_euro:
      article_number: abo-biez-EURO
  # Billable subscription types and the article (key of `articles`) they are invoiced with.
  # Types not listed here are not invoiced.
  subscription_type_articles:
    abo: abo_biez
    abo_eur: abo_biez_euro
    online_abo: abo_biez
