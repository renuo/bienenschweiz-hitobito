# Settings relevant for the hitobito_bienenschweiz wagon
# Overrides settings from the main application
application:
  logo:
    image: bienenschweiz_logo.png # put under app/assets/images
    height: 29 # pixel, has to bet set as the logo is a background image,
    width: 250 # pixel, will also set the minimal width of the navigation
    background_color: none # optional backgroundcolor, creates a box around the logo, if changed from 'none'
  languages:
    de: Deutsch

  # non UI languages for assigning to person#language
  additional_languages:
    en: Englisch
    fr: French
    it: Italian

# The person with this email has root access to everything
# This person should only be used by the operators of the application,
# not the customers.
# Initially, a password reset token may be mailed from the application
# to this address to set a password.
root_email: hitobito-bienenschweiz@renuo.ch

phone_number:
  custom_label:
    enabled: false

social_account:
  custom_label:
    enabled: false

additional_email:
  custom_label:
    enabled: false

additional_address:
  custom_label:
    enabled: false

personal_documents:
  enabled: true

kas:
  base_url: <%= ENV['KAS_BASE_URL'] %>
  api_token: <%= ENV['KAS_API_TOKEN'] %>
